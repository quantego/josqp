name: Release

# Publishes com.quantego:josqp to Maven Central whenever a v* tag is pushed.
# The Central Portal deployment is published automatically (autoPublish=true in
# pom.xml), so a green run ends with the version live in Central.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CENTRAL_USERNAME   Central Portal user-token username
#   CENTRAL_PASSWORD   Central Portal user-token password
#   GPG_PRIVATE_KEY    ASCII-armoured private key: gpg --armor --export-secret-keys <KEY-ID>
#   GPG_PASSPHRASE     passphrase of that key

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # setup-java reads these variable names and writes them into the generated
    # ~/.m2/settings.xml for the "central" server id.
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK and Central credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Verify release tag and artifact version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^[[:space:]]*<version>\([^<]*\)<\/version>[[:space:]]*$/\1/p' pom.xml | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$version"

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Build, test and deploy
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease deploy
