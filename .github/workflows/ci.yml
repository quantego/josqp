name: CI

# Run on the minimum supported runtime too, not just against the Java 8 compiler API.

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Maven host JDK
        if: matrix.java == '8'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Remember Maven host JDK
        if: matrix.java == '8'
        run: echo "MAVEN_HOST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test
        if: matrix.java != '8'
        run: mvn -B test
      - name: Test on the Java 8 runtime
        if: matrix.java == '8'
        # Maven/compiler run on 21; Surefire forks the entire suite on the actual Java 8 JVM.
        run: JAVA_HOME="$MAVEN_HOST_JAVA_HOME" mvn -B -Djvm="$JAVA_HOME/bin/java" test

  vector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Test the Vector API backend
        run: mvn -B -Pvector test
