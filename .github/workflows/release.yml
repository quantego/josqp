name: Release

# Publishes com.quantego:josqp to Maven Central whenever a v* tag is pushed.
# The Central Portal deployment is published automatically (autoPublish=true in
# pom.xml), so a green run ends with the version live in Central.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CENTRAL_USERNAME   Central Portal user-token username
#   CENTRAL_PASSWORD   Central Portal user-token password
#   GPG_PRIVATE_KEY    ASCII-armoured private key: gpg --armor --export-secret-keys <KEY-ID>
#   GPG_PASSPHRASE     passphrase of that key

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # setup-java reads these variable names and writes them into the generated
    # ~/.m2/settings.xml for the "central" server id.
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Maven 3.10's legacy repository overlay creates local metadata in the
      # Central staging directory. Plugin 0.11.0 only removes the older
      # maven-metadata-central-staging.xml name, leaving an invalid bundle.
      - name: Use Maven 3.9.16 for Central staging
        env:
          JOSQP_MAVEN_VERSION: '3.9.16'
        run: |
          archive="apache-maven-${JOSQP_MAVEN_VERSION}-bin.tar.gz"
          base="https://archive.apache.org/dist/maven/maven-3/${JOSQP_MAVEN_VERSION}/binaries"
          curl --fail --silent --show-error --location --retry 3 "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location --retry 3 "$base/$archive.sha512" -o "$RUNNER_TEMP/$archive.sha512"
          checksum=$(cat "$RUNNER_TEMP/$archive.sha512")
          [[ "$checksum" =~ ^[a-fA-F0-9]{128}$ ]]
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/$archive" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${JOSQP_MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up JDK and Central credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Verify release tag and artifact version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^[[:space:]]*<version>\([^<]*\)<\/version>[[:space:]]*$/\1/p' pom.xml | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$version"
          test -s "release-notes/$version.md"

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Build, test and deploy
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn --version
          mvn -B -Prelease clean deploy

      - name: Preserve the Central bundle for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: ignore
